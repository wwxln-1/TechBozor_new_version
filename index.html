<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechBozor | Sales Analytics</title>
  <style>
    :root { --ink: #17221d; --paper: #f4f0e6; --acid: #d7f36a; --rust: #d96b45; --line: #c9c4b8; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Georgia, serif; }
    main { max-width: 1120px; margin: auto; padding: 32px 24px 56px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: start; border-bottom: 2px solid var(--ink); padding-bottom: 24px; }
    .eyebrow { margin: 0 0 10px; font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(44px, 8vw, 92px); line-height: .9; max-width: 700px; margin: 0; letter-spacing: -0.04em; }
    .lede { max-width: 270px; font: 16px/1.45 Arial, sans-serif; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
    .stat { padding: 24px 16px 24px 0; border-right: 1px solid var(--line); }
    .stat:last-child { border: 0; padding-left: 16px; }
    .number { display: block; font-size: 38px; font-weight: 700; }
    .label { font: 12px Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
    section { padding-top: 32px; }
    h2 { margin: 0 0 18px; font-size: 28px; }
    .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    figure { margin: 0; border: 1px solid var(--line); background: #fbf8f0; padding: 10px; }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { padding: 12px 4px 4px; font: 700 13px Arial, sans-serif; }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 36px; padding-top: 18px; border-top: 2px solid var(--ink); font: 13px Arial, sans-serif; }
    a { color: var(--ink); font-weight: 700; }
    @media (max-width: 700px) { header, footer { display: block; } .lede { margin-top: 24px; } .stats { grid-template-columns: repeat(2, 1fr); } .stat { border-bottom: 1px solid var(--line); } .charts { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Onlayn elektronika do'koni / analytics</p><h1>TechBozor<br>raqamlarda.</h1></div>
      <p class="lede">PostgreSQL, MongoDB va Python asosidagi sotuvlar tahlili loyihasi.</p>
    </header>
    <div class="stats">
      <div class="stat"><span class="number">594</span><span class="label">Buyurtma</span></div>
      <div class="stat"><span class="number">180</span><span class="label">Mijoz</span></div>
      <div class="stat"><span class="number">31</span><span class="label">Mahsulot</span></div>
      <div class="stat"><span class="number">5</span><span class="label">Kategoriya</span></div>
    </div>
    <section>
      <h2>Sotuvlar ko'rinishi</h2>
      <div class="charts">
        <figure><img src="charts/01_monthly_trend.png" alt="Oylik sotuv trendi"><figcaption>Oylik sotuv trendi</figcaption></figure>
        <figure><img src="charts/02_sales_by_city.png" alt="Shaharlar bo'yicha sotuv"><figcaption>Shaharlar bo'yicha sotuv</figcaption></figure>
        <figure><img src="charts/04_category_revenue.png" alt="Kategoriya bo'yicha daromad"><figcaption>Kategoriya bo'yicha daromad</figcaption></figure>
        <figure><img src="charts/05_recency_vs_monetary.png" alt="Mijozlar tahlili"><figcaption>Mijozlar segmentatsiyasi</figcaption></figure>
      </div>
    </section>
    <footer><span>TechBozor / Data Analytics</span><a href="https://github.com/wwxln-1/TechBozor_new_version">GitHub repository -></a></footer>
  </main>
</body>
</html>
